services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private

  link-service-maintenance:
    build:
      context: ./services/link-service
      dockerfile: Dockerfile
    container_name: link-service-maintenance
    env_file:
      - .env
    volumes:
      - ./services/link-service/scripts:/app/scripts
    entrypoint: ["/app/scripts/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - private

  link-service:
    build:
      context: ./services/link-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      link-service-maintenance:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  public:
    name: short-link-public

  private:
    name: short-link-private
    internal: true